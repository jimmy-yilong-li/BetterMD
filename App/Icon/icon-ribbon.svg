<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- BetterMD 图标「书签」：米白纸面，一个墨色的 #，右上挂一条朱砂书签丝带。 -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF9F1"/>
      <stop offset="1" stop-color="#EEE1C8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8402B"/>
      <stop offset="0.5" stop-color="#D2563D"/>
      <stop offset="1" stop-color="#B03A26"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3B2612" flood-opacity="0.30"/>
    </filter>
    <filter id="ribbonShadow" x="-30%" y="-5%" width="160%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#5A2010" flood-opacity="0.35"/>
    </filter>
    <filter id="inkEdge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="2" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)" filter="url(#shadow)"/>
  <g clip-path="url(#body)">
    <g stroke="#C9B28B" stroke-opacity="0.35" stroke-width="3">
      <line x1="100" y1="330" x2="924" y2="330"/>
      <line x1="100" y1="420" x2="924" y2="420"/>
      <line x1="100" y1="510" x2="924" y2="510"/>
      <line x1="100" y1="600" x2="924" y2="600"/>
      <line x1="100" y1="690" x2="924" y2="690"/>
      <line x1="100" y1="780" x2="924" y2="780"/>
    </g>
    <g filter="url(#inkEdge)" stroke="#2B2621" stroke-width="62" stroke-linecap="round">
      <line x1="452" y1="318" x2="404" y2="742"/>
      <line x1="622" y1="318" x2="574" y2="742"/>
      <line x1="318" y1="452" x2="724" y2="452"/>
      <line x1="300" y1="610" x2="706" y2="610"/>
    </g>
    <path d="M692 90 H782 V448 L737 410 L692 448 Z" fill="url(#ribbon)" filter="url(#ribbonShadow)"/>
  </g>
</svg>
