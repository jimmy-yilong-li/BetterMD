<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- BetterMD 图标「火漆信封」：牛皮纸信封，封口一枚朱砂火漆印，印上压着 M↓（标志图形来自 dcurtis/markdown-mark，CC0）。 -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF9F1"/>
      <stop offset="1" stop-color="#EEE1C8"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBD3AB"/>
      <stop offset="1" stop-color="#D2AF7D"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2C596"/>
      <stop offset="1" stop-color="#CBA46F"/>
    </linearGradient>
    <radialGradient id="wax" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#DC5E44"/>
      <stop offset="0.7" stop-color="#B23A25"/>
      <stop offset="1" stop-color="#8E2816"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3B2612" flood-opacity="0.30"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5A3A18" flood-opacity="0.28"/>
    </filter>
    <filter id="blob" x="-15%" y="-15%" width="130%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="18" xChannelSelector="R" yChannelSelector="G" result="edge"/>
      <feDropShadow in="edge" dx="0" dy="6" stdDeviation="6" flood-color="#4A1408" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)" filter="url(#shadow)"/>

  <g filter="url(#soft)">
    <rect x="196" y="322" width="632" height="420" rx="34" fill="url(#kraft)" stroke="#B08650" stroke-width="3"/>
    <path d="M214 728 L512 526 L810 728" fill="none" stroke="#B08650" stroke-opacity="0.45" stroke-width="5" stroke-linejoin="round"/>
    <path d="M202 336 H822 L546 556 Q512 584 478 556 Z" fill="url(#flap)" stroke="#B08650" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g transform="translate(512 556)">
    <circle r="100" fill="url(#wax)" filter="url(#blob)"/>
    <circle r="70" fill="none" stroke="#7A1E10" stroke-opacity="0.35" stroke-width="6"/>
    <path transform="scale(0.78) translate(-107.5 -64)" fill="#FFFFFF" fill-opacity="0.22"
          d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0l-30-33h20V30h20v35h20z" />
    <path transform="translate(1.5 2.5) scale(0.78) translate(-107.5 -64)" fill="#7E2214" fill-opacity="0.85"
          d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0l-30-33h20V30h20v35h20z"/>
  </g>
</svg>
